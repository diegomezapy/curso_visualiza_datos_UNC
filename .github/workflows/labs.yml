name: labs
on: [push, pull_request]
jobs:
  ejecutar-labs:
    runs-on: ubuntu-latest
    env: { MPLBACKEND: Agg }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python datos/generar_datos.py
      - run: for f in sesiones/0[1-8]*/lab*.py; do echo "== $f"; python -W ignore "$f"; done
      - run: python tools/py2nb.py
