<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base target="_top"><style>
:root{--bg:#f6f8fa;--card:#fff;--fg:#1f2328;--mut:#59636e;--bd:#d1d9e0;--ac:#0072B2;--ok:#1a7f4b;--bad:#c2410c}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#161b22;--fg:#e6edf3;--mut:#9198a1;--bd:#30363d;--ac:#56B4E9;--ok:#3fb950;--bad:#f0883e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:auto;padding:1.2rem 1rem 3rem}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:1.1rem 1.2rem;margin:1rem 0}
h1{font-size:1.4rem;margin:.2rem 0}.muted{color:var(--mut);font-size:.9rem}.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:.8rem 1.3rem;font:inherit;font-weight:700;cursor:pointer;width:100%}.btn[disabled]{opacity:.5}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}.q{border:1px solid var(--bd);border-radius:10px;padding:.7rem .9rem;margin:.8rem 0}.q legend{font-weight:600}
.opt{display:flex;gap:.6rem;padding:.3rem .4rem;border-radius:8px;cursor:pointer}.opt.r{background:color-mix(in srgb,var(--ok) 16%,transparent)}.opt.w{background:color-mix(in srgb,var(--bad) 14%,transparent)}
.why{margin-top:.4rem;padding:.4rem .7rem;border-left:4px solid var(--ac);font-size:.9rem;color:var(--mut)}
</style></head><body><main>
<div class="card"><div class="muted">Visualización de Datos · MICD · FACET – UNC</div><h1>📝 Mini-evaluación</h1><div id="t" class="muted">Cargando…</div>
<p class="muted"><b>No suma puntos</b> para la certificación: sirve para saber qué reforzar.</p></div>
<form id="f" class="card" hidden><div id="qs"></div><button class="btn" id="b" type="submit">Enviar y ver respuestas</button><p id="m" role="status"></p></form>
<script>
const E = <?!= JSON.stringify(e).replace(/</g, '\\u003c') ?>, U = <?!= JSON.stringify(u).replace(/</g, '\\u003c') ?>, T = <?!= JSON.stringify(t).replace(/</g, '\\u003c') ?>;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let P = [];
google.script.run.withSuccessHandler(function (r) {
  if (!r.ok) { document.getElementById('t').innerHTML = '<span class="bad">' + esc(r.msg) + '</span>'; return; }
  P = r.preguntas; document.getElementById('t').textContent = r.titulo;
  document.getElementById('qs').innerHTML = P.map(function (p, n) { return '<fieldset class="q"><legend>' + (n + 1) + '. ' + esc(p.q) + '</legend>' + p.o.map(function (o, k) { return '<label class="opt"><input type="radio" name="q' + p.i + '" value="' + k + '"><span>' + esc(o) + '</span></label>'; }).join('') + '</fieldset>'; }).join('');
  document.getElementById('f').hidden = false;
}).withFailureHandler(function () { document.getElementById('t').textContent = 'No se pudo cargar.'; }).getMini(E, U, T);
document.getElementById('f').addEventListener('submit', function (ev) {
  ev.preventDefault(); var resp = {}, falta = 0;
  P.forEach(function (p) { var c = document.querySelector('input[name=q' + p.i + ']:checked'); if (c) resp[p.i] = +c.value; else falta++; });
  var m = document.getElementById('m'); if (falta) { m.className = 'bad'; m.textContent = 'Falta responder ' + falta + ' pregunta(s).'; return; }
  document.getElementById('b').disabled = true;
  google.script.run.withSuccessHandler(function (r) {
    if (!r.ok) { m.className = 'bad'; m.textContent = r.msg; return; }
    document.getElementById('f').innerHTML = '<h2>Resultado: ' + r.aciertos + ' de ' + r.total + '</h2>' + (r.msg ? '<p class="muted">' + esc(r.msg) + '</p>' : '') +
      P.map(function (p, n) { var d = r.detalle.filter(function (x) { return x.i === p.i; })[0]; return '<fieldset class="q"><legend>' + (n + 1) + '. ' + esc(p.q) + '</legend>' + p.o.map(function (o, k) { return '<div class="opt ' + (k === d.correcta ? 'r' : (k === resp[p.i] ? 'w' : '')) + '">' + esc(o) + (k === d.correcta ? ' ✔' : (k === resp[p.i] ? ' ✘' : '')) + '</div>'; }).join('') + '<div class="why">' + esc(d.why) + '</div></fieldset>'; }).join('') +
      '<p class="muted">Gracias. Esta mini-evaluación no suma puntos.</p>';
  }).withFailureHandler(function () { m.className = 'bad'; m.textContent = 'No se pudo enviar.'; document.getElementById('b').disabled = false; }).enviarMini(E, U, T, resp);
});
</script></main></body></html>
